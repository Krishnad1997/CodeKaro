<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Random Background Color Changer</title>
<style>
  body {
    font-family: Arial, sans-serif;
    height: 100vh;
    margin: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: background-color 0.3s ease;
    background-color: #f4f4f4;
  }

  h1 {
    text-align: center;
    padding: 0 20px;
  }

  button {
    padding: 12px 24px;
    font-size: 16px;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    background-color: #222;
    color: #fff;
    margin-top: 10px;
  }

  button:hover {
    opacity: 0.85;
  }

  #hexCode {
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
    background-color: rgba(255, 255, 255, 0.6);
    padding: 6px 12px;
    border-radius: 4px;
  }
</style>
</head>
<body>

  <h1>Click the Button to Change the Background Color!</h1>
  <button id="changeColorBtn">Change Color</button>
  <p id="hexCode">#f4f4f4</p>

  <script>
    const button = document.getElementById('changeColorBtn');
    const hexDisplay = document.getElementById('hexCode');

    function getRandomColor() {
      const letters = '0123456789ABCDEF';
      let color = '#';
      for (let i = 0; i < 6; i++) {
        color += letters[Math.floor(Math.random() * 16)];
      }
      return color;
    }

    button.addEventListener('click', () => {
      const randomColor = getRandomColor();
      document.body.style.backgroundColor = randomColor;
      hexDisplay.textContent = randomColor;
    });
  </script>

</body>
</html>
